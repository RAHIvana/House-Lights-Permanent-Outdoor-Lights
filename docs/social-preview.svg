  <!-- House Lights social preview (GitHub "Social preview", 1280x640): the approved amber bulb on night blue,
       with a roofline of lit bulbs in four of the theme families (Christmas, USA, Halloween, Diwali).
       Static shapes only: no script, so it shows the same everywhere. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#1c2541"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b544" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>

  <g fill="#f7e7c6" opacity="0.55">
    <circle cx="96" cy="84" r="1.8"/><circle cx="214" cy="150" r="1.4"/><circle cx="330" cy="62" r="1.6"/>
