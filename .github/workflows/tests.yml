name: tests

on:
  push:
    branches: [main]
  pull_request:

# The tests need no lights, no network and no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_settings.py
      - run: python tests/test_setup.py
      - run: python tests/test_schedule.py
      - run: python tests/test_themes.py
      - run: python tests/test_drivers.py
      - run: python tests/test_security.py
